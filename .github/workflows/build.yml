name: Construir app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Armar el APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Renombrar
        run: cp app/build/outputs/apk/debug/app-debug.apk MiTurno.apk

      - name: Publicar para descargar en el celular
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ultima
          name: Mi turno (última versión)
          body: Descarga MiTurno.apk desde tu celular e instálalo.
          files: MiTurno.apk
          make_latest: true
